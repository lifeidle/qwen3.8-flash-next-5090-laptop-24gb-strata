<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="380" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="42" font-size="20" font-weight="700" fill="#1f2328">IQ3_S @ 256K — MTP spec sweep (single lane, RTX 5090 Laptop 24GB)</text>
  <text x="28" y="66" font-size="13" fill="#57606a">decode tok/s (3-request median) · draft acceptance · 2026-10-20 · --spec-min-p 0.5 for all runs</text>

  <!-- scale: 0..110 tok/s maps to x 340..830 (490 px) = 4.4545 px per tok/s -->
  <!-- 1. spec 2 — 97.7 tok/s, 71.1% (winner) -->
  <text x="330" y="118" font-size="13.5" text-anchor="end" fill="#1f2328" font-weight="700">spec 2</text>
  <rect x="340" y="104" width="435" height="26" rx="4" fill="#1a7f37"/>
  <text x="783" y="122" font-size="13.5" font-weight="700" fill="#ffffff">97.7 tok/s</text>
  <text x="340" y="148" font-size="12.5" fill="#1a7f37" font-weight="700">draft acceptance 71.1% — highest of all specs</text>

  <!-- 2. spec 3 — 94.2, 54.6% -->
  <text x="330" y="198" font-size="13.5" text-anchor="end" fill="#1f2328">spec 3</text>
  <rect x="340" y="184" width="420" height="26" rx="4" fill="#539bf5"/>
  <text x="768" y="202" font-size="13.5" font-weight="700" fill="#ffffff">94.2 tok/s</text>
  <text x="340" y="228" font-size="12.5" fill="#57606a">draft acceptance 54.6%</text>

  <!-- 3. spec 4 — 94.3, 55.8% (setup default) -->
  <text x="330" y="278" font-size="13.5" text-anchor="end" fill="#1f2328">spec 4 (setup default)</text>
  <rect x="340" y="264" width="420" height="26" rx="4" fill="#539bf5"/>
  <text x="768" y="282" font-size="13.5" font-weight="700" fill="#ffffff">94.3 tok/s</text>
  <text x="340" y="308" font-size="12.5" fill="#57606a">draft acceptance 55.8%</text>

  <rect x="28" y="330" width="824" height="1" fill="#d0d7de"/>
  <text x="28" y="354" font-size="13" fill="#1f2328" font-weight="700">Takeaway: the setup default (spec 4 / min-p 0.5) is suboptimal for IQ3_S.</text>
  <text x="28" y="372" font-size="13" fill="#57606a">spec 2 wins on both decode speed and draft acceptance. Config: --spec 2 --spec-min-p 0.5 · RAM margin ~3.5 GB during the sweep.</text>
</svg>
