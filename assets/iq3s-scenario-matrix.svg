  <rect x="28" y="564" width="824" height="1" fill="#d0d7de"/>
  <text x="28" y="588" font-size="13" fill="#1f2328" font-weight="700">Takeaway: spec 2 wins nearly everywhere — and MTP acceptance RISES with prompt length</text>
  <text x="28" y="606" font-size="13" fill="#57606a">(spec 2: 59% short-in → 85% at ~7K prompt). Long-context work (your project docs) gets the biggest MTP boost. Prefill: 2700-2820 tok/s on long inputs, no watchdog events.</text>
